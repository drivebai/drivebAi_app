# fly.toml app configuration file generated for drivebai-api on 2026-02-09T13:19:29+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'drivebai-api-team'
primary_region = 'ewr'

[build]

[env]
  UPLOAD_DIR = "/data/uploads"
  ENV = "production"
  # Static, non-secret knobs. Sensitive overrides go through `fly secrets set`
  # (UPLOAD_URL_SECRET, CORS_ALLOWED_ORIGINS, STRIPE_*, APNS_AUTH_KEY_P8,
  # APPLE_TEAM_ID, APNS_KEY_ID).
  PICKUP_DEADLINE_MINUTES = "120"
  PICKUP_EXPIRY_SCAN_INTERVAL_SECONDS = "60"
  REQUIRE_PRIVATE_UPLOAD_SIGNATURES = "true"
  # Car sales: PUBLIC kill switch stays ON (client decision Sep 11 — the
  # App Store build has a Buy button with no inspection UI). Seller payouts
  # exist since v96; the sale flow runs as a PILOT behind this switch for
  # the users named in the SALES_ALLOWLIST_USER_IDS secret (both parties to
  # a sale must be listed). Flip to "false" only once build 37 (buyer
  # inspection countdown + warnings + handover confirm) is on the store.
  DISABLE_CAR_SALES = "true"
  # Rolling (weekly auto-renewing) rentals: ON since v99 (client decision
  # Sep 11, after v98 verified clean on production). Only builds 35+ ever
  # offer the weekly option (they read /config); the App Store build cannot
  # create a rolling lease. This is a KILL SWITCH: set to "false" and
  # redeploy to stop every phase that takes money — see
  # docs/DESIGN_RECURRING_BILLING.md §10 for what stops and what keeps
  # running while it is off.
  ROLLING_RENTALS_ENABLED = "true"
  UPLOAD_URL_TTL = "1h"
  # iOS bundle ID — public, not secret. Lives here so the APNs send loop has
  # a topic to claim without needing a separate fly secrets set step.
  IOS_BUNDLE_ID = "com.drivebai.DriveBai"
  # APNS_SANDBOX flips the default APNs host used when the iOS client sent
  # `sandbox=false` (Release builds). Per-token sandbox flag stored in DB
  # is the authoritative router; this env is the default fallback.
  APNS_SANDBOX = "false"

[mounts]
  source = "drivebai_uploads"
  destination = "/data/uploads"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
